spring.application.name=session-login

# Override these in real deployments with APP_USERNAME and APP_PASSWORD.
app.user.username=${APP_USERNAME:user}
app.user.password=${APP_PASSWORD:changeit}

# The container creates JSESSIONID after authentication. HttpOnly prevents
# JavaScript access; SameSite=Lax limits cross-site requests. Enable Secure
# in production when the application is served over HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
