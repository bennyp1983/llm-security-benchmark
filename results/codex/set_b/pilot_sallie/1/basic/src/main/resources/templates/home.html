<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="card">
    <h1>Authenticated</h1>
    <p>Welcome, <strong th:text="${username}">user</strong>. Your browser is maintaining this session with a secure, HTTP-only session cookie.</p>
    <form th:action="@{/logout}" method="post">
        <button type="submit">Sign out</button>
    </form>
</main>
</body>
</html>
