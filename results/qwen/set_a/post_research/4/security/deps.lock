# Pinned third-party jars. scripts/get-deps.sh refuses any file whose SHA-256
# differs from this file, and requires the same digest from two independent
# Maven Central distributors plus the published SHA-1 before installing a jar.
#
# record:  jar <file> <maven-central path> <sha256> <must-contain-entry> <signed|unsigned>
#
# h2 2.5.252      - embedded SQL engine (MPL-2.0, secondary LGPL-3.0)
# spring-security 6.5.11 - Argon2id password encoder (Apache-2.0), Spring Security 6.5 GA line
# bcprov 1.82     - Bouncy Castle Argon2 primitive consumed by the encoder (MIT)
jar h2-2.5.252.jar                com/h2database/h2/2.5.252/h2-2.5.252.jar                                    90b11dc413da82070ef15fc943282c1408e6ffd34fa68998335fea8603b5ff20 org/h2/engine/Database.class                       unsigned
jar spring-security-crypto-6.5.11.jar org/springframework/security/spring-security-crypto/6.5.11/spring-security-crypto-6.5.11.jar dcdd2f3b2d5d2bb1531986b5cc1737b464a76d8b5831f93fc8da9cdd67e6797f org/springframework/security/crypto/argon2/Argon2PasswordEncoder.class unsigned
jar bcprov-jdk18on-1.82.jar        org/bouncycastle/bcprov-jdk18on/1.82/bcprov-jdk18on-1.82.jar                14cde2fdfaa8890480a8e5b67aceef0c90f96682c1e23c133bafdc9e0b3255ce org/bouncycastle/crypto/generators/Argon2BytesGenerator.class      signed
# commons-logging 1.3.5 (Apache-2.0) - test-only: the transitive dependency of
# spring-security-crypto, pulled in solely so the test suite can use Spring's
# Argon2PasswordEncoder as an independent oracle for our hash format.
test-jar commons-logging-1.3.5.jar  commons-logging/commons-logging/1.3.5/commons-logging-1.3.5.jar  6d7a744e4027649fbb50895df9497d109f98c766a637062fe8d2eabbb3140ba4  org/apache/commons/logging/LogFactory.class  unsigned
